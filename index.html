<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Vocabulary Trainer</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>語彙 Trainer N5</h1>

        <input type="number" id="sessionSize" value="50" min="10">

        <br><br>

        <button id="startBtn">
            Start Session
        </button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="progressText"></div>

        <!-- <button id="showBtn">
            Show Meaning
        </button> -->

        <div id="card">
            <div id="japanese"></div>
            <div id="meaning"></div>
        </div>

        <br><br>

        <br><br>

        <button id="knowBtn">
            ✅ Knew It
        </button>

        <button id="missBtn">
            ❌ Missed It
        </button>


    </div>

    <script src="script.js"></script>

</body>

</html>
